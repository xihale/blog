name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ astro ]
  pull_request:
    branches: [ astro ]
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 6 */7 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment'
    permissions:
      contents: read
    outputs:
      build: ${{ steps.debounce.outputs.build }}
    steps:
      - name: Filter blog comment issues
        id: debounce
        run: |
          LABELS='${{ toJson(github.event.issue.labels) }}'
          if ! echo "$LABELS" | grep -q 'blog-comment'; then
            echo "Not a blog-comment issue, skipping"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Relevant blog comment detected, building immediately"
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: >-
      always() &&
      (github.event_name != 'issue_comment' || needs.check.outputs.build == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ (github.event_name == 'issue_comment' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'refs/heads/astro' || github.ref }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Cache Bun packages
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Run Autocorrect
      run: bun run lint

    - name: Run Astro check
      run: bunx astro check

    - name: Sync comments
      run: bun run comments
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        COMMENTS_SYNC_MODE: ${{ github.event_name == 'pull_request' && 'readonly' || 'write' }}

    - name: Build
      run: bun run build

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
