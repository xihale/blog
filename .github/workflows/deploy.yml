name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ astro ]
  pull_request:
    branches: [ astro ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Cache Bun packages
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Setup Python for font tools
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install font tools
      run: pip install fonttools brotli

    - name: Run Autocorrect
      run: bun run lint

    - name: Subset font
      run: bun run subset-font

    - name: Verify subset font output
      run: |
        ls -la public/fonts
        test -s public/fonts/lxgw.woff2

    - name: Build
      run: bun run build

    - name: Verify built font artifact
      run: |
        ls -la dist/fonts
        test -s dist/fonts/lxgw.woff2

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # if: github.ref == 'refs/heads/master'

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
