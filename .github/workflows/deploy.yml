name: Build (PR validation)

# Deploys run on the server via webhook (scripts/server/) — this workflow
# only gates PRs with the same lint + check + build steps.
on:
  pull_request:
    branches: [astro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Autocorrect
        run: bun run lint

      - name: Run Astro check
        run: bunx astro check

      - name: Build
        run: bun run build
